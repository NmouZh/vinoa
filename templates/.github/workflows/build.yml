name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the JDK required by the generated modules
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '{{ javaTargetMax }}'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the JDK required by the generated modules
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '{{ javaTargetMax }}'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: ./gradlew build --no-daemon --stacktrace
