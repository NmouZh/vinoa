# Generated by vinoa from the version matrix. This file is the single source of versions.
# Platform coordinates are injected here; modules only ever reference aliases (libs.*).
[versions]
# Target Minecraft version (informational: the coordinates below are already resolved).
mc = "{{ mcVersion }}"
gradle = "{{ gradleVersion }}"
{% for p in platforms %}
{{ p }}ApiVersion = "{{ apiVersions[p] }}"
{% endfor %}
# Quality tooling: a Java 8 target needs the legacy line, every other target the modern line.
checkstyleLegacy = "{{ checkstyleLegacyVersion }}"
checkstyleModern = "{{ checkstyleModernVersion }}"
junitLegacy = "{{ junitLegacyVersion }}"
junitModern = "{{ junitModernVersion }}"
# Build/run helpers.
{% if cap_run_paper %}
runPaper = "{{ runPaperVersion }}"
{% endif %}
shadow = "{{ shadowVersion }}"

[libraries]
{% for p in platforms %}
{{ p }}-api = { module = "{{ apiModules[p] }}", version.ref = "{{ p }}ApiVersion" }
{% endfor %}
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-bom-legacy = { module = "org.junit:junit-bom", version.ref = "junitLegacy" }
junit-bom-modern = { module = "org.junit:junit-bom", version.ref = "junitModern" }

{% if cap_run_paper %}
[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
{% endif %}
