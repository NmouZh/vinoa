# Generated by vinoa. Paper plugin descriptor.
# There is deliberately no "commands:" section here: Paper ignores it for this format and the
# command is registered through the Brigadier lifecycle API instead. Shipping both plugin.yml
# and this file would double-register the command.
name: {{ pluginName }}
version: "${version}"
main: {{ mainClass }}
# Required for the Paper plugin format; 1.19 is the lowest value it accepts.
api-version: '1.19'
description: '{{ pluginDescription }}'
{% if has_authors %}
authors:
{% for a in authors %}
  - '{{ a }}'
{% endfor %}
{% endif %}
{% if cap_permissions %}
permissions:
  {{ permissionNode }}.example:
    description: 'Allows using /{{ commandName }}.'
    default: op
  {{ pluginId }}.admin:
    description: 'Administrative access to {{ pluginName }}.'
    default: op
    children:
      {{ permissionNode }}.example: true
{% endif %}
