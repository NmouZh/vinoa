# Generated by vinoa. BungeeCord reads a POJO-style descriptor.
# There is deliberately no commands: section here: BungeeCord ignores it and the command is
# registered from code instead. Likewise there is no api-version field in this format.
name: {{ pluginName }}
main: {{ mainClass }}
version: "${version}"
description: '{{ pluginDescription }}'
{% if has_authors %}
author: '{{ authors[0] }}'
{% endif %}
