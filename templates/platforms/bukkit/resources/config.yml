# Generated by vinoa. Runtime configuration of the {{ pluginName }} plugin.
# Message shown to a player who joins. {player} is replaced by the player name.
welcome-message: '&aWelcome, {player}!'
# Prefix prepended to broadcast messages.
broadcast-prefix: '[{{ pluginName }}]'
# Enables verbose logging.
debug: false
{% if cap_dual_lang %}
# Locale used by default when several language packs are bundled.
default-locale: zh_CN
{% endif %}
