# Generated by vinoa. Bukkit/Spigot metadata; Paper reads this file too.
name: {{ pluginName }}
# Quoted on purpose: an unquoted version is coerced by SnakeYAML (for example 1.10 -> 1.1).
version: "${version}"
main: {{ mainClass }}
{% if cap_api_version_line %}
api-version: '{{ pluginYmlApiVersion }}'
{% endif %}
description: '{{ pluginDescription }}'
{% if has_authors %}
authors:
{% for a in authors %}
  - '{{ a }}'
{% endfor %}
{% endif %}
commands:
  {{ commandName }}:
    description: '{{ pluginDescription }}'
    usage: /{{ commandName }} <message>
{% if cap_permissions %}
    permission: {{ permissionNode }}.example
    permission-message: 'You do not have permission to use this command.'
{% endif %}
{% if cap_permissions %}
permissions:
  {{ permissionNode }}.example:
    description: 'Allows using /{{ commandName }}.'
    default: op
  {{ pluginId }}.admin:
    description: 'Administrative access to {{ pluginName }}.'
    default: op
    children:
      {{ permissionNode }}.example: true
{% endif %}
