[quality]
# 质量工具版本（canonical key；engine-dev 按同名读取）。
# *_legacy = 目标 Java 8 时改用的版本（§9.5 硬地板，字节码探测来源见 [LEG §3]）。
# 两档，不设中间档：Checkstyle/SpotBugs 跑在 **Gradle 的 JVM** 上，而 Gradle 9.8 要求 JVM 17–27；
# 真正的约束是"能否在 JDK 17 上跑"，不是"目标 Java 几"。13.x 需 Java 21，反而会坑 JDK 17 的用户（lead 裁定）。
checkstyle = "10.24.0"        # Gradle 9 默认 toolVersion，JDK 17 可跑，可分析 Java 8 源码
checkstyle_legacy = "9.3"     # 键保留；v1 用不到（见上：不设目标-Java-8 档）
junit = "6.1.3"                 # [LEG §3.3] JUnit 6 = class major 61 → 需 Java 17
junit_legacy = "5.14.4"         # [LEG §3.3] 最后一个 Java 8 可加载的 5.x
spotbugs = "4.10.4"             # [LEG §3.2] 4.10.x 需 Java 11 运行
spotbugs_legacy = "4.8.6"       # [LEG §3.2] 最后一版能跑在 Java 8 上

[gradle]
version = "9.8.0"               # [VM §5.1] services.gradle.org/versions/current
run_on_jvm = "17-27"           # [LEG §2.1] Gradle 9.8 运行 Gradle 需 JVM 17–27
java25_toolchain_min = "9.1.0" # [VM §5.1] Java 25 toolchain 需 Gradle ≥ 9.1.0
[gradle.shadow]
version = "9.6.1"                     # [VM §5.2] .module org.gradle.plugin.api-version / jvm.version
gradle_min = "9.2.0"
java = 17
[gradle.run_paper]
version = "3.1.0"                     # [VM §5.3] marker 3.1.0；同级 run-velocity/run-waterfall 同版本
gradle_min = "9.7.0"
java = 17
[gradle.run_velocity]
version = "3.1.0"                     # [VM §5.3] 与 run-paper 同一实现 artifact xyz.jpenilla:run-task
gradle_min = "9.7.0"
java = 17
[gradle.paperweight]
version = "2.0.0-beta.24"             # [VM §5.4] io.papermc.paperweight.userdev，仅 Plugin Portal 有 beta
gradle_min = "9.7.1"
java = 21

[gradle.spotbugs_plugin]
# `--features spotbugs` 用的 Gradle 插件 com.github.spotbugs —— 与 [quality].spotbugs（分析工具）
# 是两个版本，键名区分（canonical key: spotbugs_plugin）。
version = "6.5.11"   # plugins.gradle.org/m2 marker <release>（lastUpdated 20260820）；等价实现 com.github.spotbugs.snom:spotbugs-gradle-plugin
# 无 gradle_min：该 .module 不声明 org.gradle.plugin.api-version（由 Gradle 8.14.5 构建），
# 与 shadow/run-paper 那种硬地板不同；能不能跑在 Gradle 9.8 上以首次真机构建为准（§9.4 默认关）。
java = 11            # .module org.gradle.jvm.version = 11（Gradle 9.8 的 JVM 17–27 满足）

[repositories]
# 仓库 id → URL（数据侧唯一事实源；2026-09-25 实测）。仅数据：Resolved 暂不透出，
# 生成物当前的仓库字面量由 templates-dev 写在模板里（§8.3）。
central         = "https://repo1.maven.org/maven2/"
papermc         = "https://repo.papermc.io/repository/maven-public/"   # 代理 spigot-api(含 net.md-5 快照)/destroystokyo/papermc/velocity/bungeecord
extendedclip    = "https://repo.extendedclip.com/releases/"            # 仅 PlaceholderAPI
spongepowered   = "https://repo.spongepowered.org/repository/maven-public/"  # SpongeAPI（含 -SNAPSHOT 线）

[thirdparty]
# 三方坐标并入矩阵，矩阵是唯一写入点（§6.1/R6）。gui 不引三方库：GUI 用纯 Bukkit Inventory 自研。
# java_min 由 jar 内 class 文件 major 实测（major 52 = Java 8）；
# 目标模块 Java < java_min 时 resolve_with_features 必须硬报错，绝不生成构建不过的工程。
# 仓库归属（2026-09-25 实测）：bstats / sqlite_jdbc 在 Maven Central；
# me.clip:placeholderapi:2.11.6 只在 https://repo.extendedclip.com/releases/（Central 与
# repo.papermc.io/maven-public 均 404），该源字面量由 templates-dev 写在 cap_placeholderapi 平台脚本里。
placeholderapi = { coordinate = "me.clip:placeholderapi:2.11.6", java_min = 8, scope = "platform", repos = ["extendedclip"] }
bstats         = { coordinate = "org.bstats:bstats-bukkit:3.2.1", java_min = 8, scope = "platform", repos = ["central"] }
sqlite_jdbc    = { coordinate = "org.xerial:sqlite-jdbc:3.53.4.0", java_min = 8, scope = "core", repos = ["central"] }

