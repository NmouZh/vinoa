# 版本矩阵数据（OWNER: matrix-dev）。schema 契约见 docs/spec/vinoa-cli.md §6。
#
# 数据源（逐条字面抄录，禁止范围推导、禁止在代码/数据里拼接坐标）：
#   [VM]  docs/research/version-matrix-sources.md §7 66 行机读表（java_min/recommended、
#         paper/folia 逐版本可用性、sponge_api、paper_api 坐标）、§2.2/§3/§4/§5
#   [LEG] docs/research/legacy-mc-build-feasibility.md §1.1（spigot-api 1.8.x–1.16.x 完整枚举，
#         无 1.8.9 制品 → 1.8.9 用 1.8.8）、§2.1–§2.3（Gradle 9.8 可编译到 Java 8）
#   [PROXY] docs/research/proxy-plugin-project-shape.md §0（velocity-api 4.2.0 / bungeecord-api）
#
# 硬规则：
#   1. 只有明确存在的 (平台, MC 版本) 才进 versions 白名单；不做区间推导。
#   2. 坐标一律逐条字面写在 coordinate_map/pinned/coordinates 里；resolve 只查表，不拼串。
