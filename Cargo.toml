[package]
name = "vinoa"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Scaffold Minecraft server plugin projects"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
inquire = "0.9.4"
minijinja = "2.24.0"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
ureq = "3.4.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
